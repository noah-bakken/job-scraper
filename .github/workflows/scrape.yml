name: Scrape jobs

on:
  schedule:
    # Hourly, offset from the top of the hour (not :00) to dodge the
    # congestion spike every other repo's :00/:15/:30 schedules create --
    # GitHub explicitly documents that schedule-triggered workflows can be
    # delayed under load, and busiest right at round numbers.
    #
    # This used to be */20 (every 20 minutes), on the theory that even with
    # scheduler delays, detection lag would stay under an hour. In practice
    # it did the opposite: GitHub silently throttles schedule triggers more
    # frequent than hourly, and confirmed live over 4 days, this ran at only
    # 25-40% of its configured rate, with real gaps up to 11 hours -- worse
    # than an honest hourly schedule would ever be. Times are UTC.
    - cron: "7 * * * *"
  workflow_dispatch:      # manual "Run workflow" button for testing
    inputs:
      test_email:
        description: "Send a sample digest instead of scraping, to verify email works"
        type: boolean
        default: false

# Prevent overlapping runs if one is slow.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # Sheet ID, not a credential, but kept out of a public repo.
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scrape_jobs.py ${{ inputs.test_email && '--test-email' || '' }}
